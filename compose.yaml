# Local development database. The game server runs outside Docker for now (uv run uvicorn ...);
# it joins this file as another service when we deploy.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dg_village
      POSTGRES_PASSWORD: dg_village
      POSTGRES_DB: dg_village
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dg_village"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
